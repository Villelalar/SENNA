openapi: 3.0.0
info:
  title: Senna API
  version: 1.0.0
  description: Documentacao da API do projeto Pense Bem
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      summary: Verifica se a API esta funcionando
      responses:
        '200':
          description: API funcionando
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /api/users/create:
    post:
      summary: Cria um usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nome
                - email
                - senha
              properties:
                nome:
                  type: string
                  example: Maria Silva
                email:
                  type: string
                  format: email
                  example: maria@email.com
                senha:
                  type: string
                  format: password
                  example: '123456'
      responses:
        '201':
          description: Usuario criado com sucesso
        '400':
          description: Dados obrigatorios ausentes
        '409':
          description: E-mail ja cadastrado
  /api/users/{id}:
    get:
      summary: Busca um usuario pelo ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Usuario encontrado
        '404':
          description: Usuario nao encontrado
  /api/users/login:
    post:
      summary: Realiza o login do usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - senha
              properties:
                email:
                  type: string
                  format: email
                  example: maria@email.com
                senha:
                  type: string
                  format: password
                  example: '123456'
      responses:
        '200':
          description: Login bem-sucedido
        '401':
          description: E-mail ou senha inválidos